<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - ChatGPT 스타일</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="top-right-profile">
        <button id="btn-gpt-profile" class="profile-avatar-btn" title="마이페이지">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>

        <div id="profile-dropdown" class="profile-dropdown-menu">
            <div class="dropdown-header">내 계정</div>
            
            <button id="btn-gpt-create" class="dropdown-item">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>새 채팅 생성</span>
            </button>

            <hr class="dropdown-divider">

            <button id="btn-gpt-logout" class="dropdown-item logout-item">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>로그아웃</span>
            </button>
        </div>
    </div>

    <div class="auth-wrapper">
        <div class="brand-logo">
            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2A10 10 0 0 1 22 12A10 10 0 0 1 12 22M0 18a8 8 0 0 1 1 1 8-8a8 8 0 0 1-8 8Z" fill="currentColor"/>
            </svg>
        </div>

        <div class="auth-container">
            <h1 class="auth-title">환영합니다</h1>
            <p class="auth-subtitle">계정 정보를 입력하여 계속하세요.</p>

            <form id="loginForm">
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="이메일 주소" required>
                </div>

                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="비밀번호" required>
                </div>

                <button type="submit" class="btn-continue">계속</button>
            </form>

            <div class="auth-footer">
                <span>계정이 없으신가요?</span>
                <a href="register.html" class="auth-link">가입하기</a>
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script src="js/login.js"></script>
</body>
</html>
